<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 48px 40px;
            width: 380px;
            text-align: center;
            backdrop-filter: blur(12px);
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { color: #fff; font-size: 1.6rem; margin-bottom: 8px; }
        p { color: #718096; margin-bottom: 32px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:hover { transform: translateY(-2px); }
        .back { margin-top: 20px; }
        .back a { color: #718096; font-size: 14px; text-decoration: none; }
        .back a:hover { color: #a0aec0; }
        .error {
            background: rgba(245,101,101,0.15);
            border: 1px solid rgba(245,101,101,0.3);
            color: #fc8181;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="icon">🔑</div>
    <h2>Đăng nhập</h2>
    <p>Xác thực qua Keycloak SSO</p>

    <div th:if="${param.error}" class="error">
        ❌ Đăng nhập thất bại. Vui lòng thử lại.
    </div>

    <a href="/oauth2/authorization/keycloak" class="btn">
        🚀 Đăng nhập với Keycloak
    </a>

    <div class="back">
        <a href="/">← Về trang chủ</a>
    </div>
</div>
</body>
</html>
