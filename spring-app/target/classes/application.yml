server:
  port: 8081

spring:
  application:
    name: oauth2-demo

  # =============================================
  # OAuth2 CLIENT config (Browser login flow)
  # =============================================
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-boot-app
            client-secret: spring-boot-secret-key-2024
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/demo-realm
            user-name-attribute: preferred_username

      # =============================================
      # OAuth2 RESOURCE SERVER config (JWT validation)
      # =============================================
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/demo-realm
          jwk-set-uri: http://keycloak:8080/realms/demo-realm/protocol/openid-connect/certs

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    com.example: DEBUG
