  #     JWT_VERIFY_SIGNATURE: "false"
  #     SESSION_STORAGE_TYPE: memory # options: redis, database, memory (concurrent-map)
  #   ports:
  #     - "8082:8082"
  #   depends_on:
  #     keycloak:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - oauth2-network
  #   healthcheck:
  #     test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8888:8888"
    # depends_on:
    #   - auth-service
    networks:
      - oauth2-network
    command: [ "run", "-c", "/etc/krakend/krakend.json" ]

networks:
  oauth2-network:
    driver: bridge

volumes:
  keycloak_data:
    driver: local
