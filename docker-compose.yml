version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true" # bật health endpoint
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    networks:
      - oauth2-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r

            Host: localhost\r

            Connection: close\r

            \r

            ' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # quan trọng: cho KC đủ thời gian boot

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - oauth2-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # auth-service:
  #   build:
  #     context: ./auth-service
  #     dockerfile: Dockerfile
