version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak-config/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    networks:
      - oauth2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/master"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - oauth2-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      AUTH_SERVICE_PORT: "8082"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: demo-realm
      KEYCLOAK_CLIENT_ID: spring-boot-app
      KEYCLOAK_CLIENT_SECRET: spring-boot-secret-key-2024
      REDIS_ADDR: redis:6379
      JWT_VERIFY_SIGNATURE: "false"
    ports:
      - "8082:8082"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oauth2-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: devopsfaith/krakend:2.4
    container_name: gateway
    volumes:
      - ./gateway:/etc/krakend
    ports:
      - "8888:8888"
    depends_on:
      - auth-service
    networks:
      - oauth2-network
    command: ["run", "-c", "/etc/krakend/krakend.json"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      GATEWAY_URL: http://gateway:8888
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8888
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - oauth2-network

  spring-app:
    build:
      context: ./spring-app
      dockerfile: Dockerfile
    container_name: spring-app
    environment:
      SERVER_PORT: "8081"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: demo-realm
      AUTH_SERVICE_URL: http://auth-service:8082
    ports:
      - "8081:8081"
    depends_on:
      - keycloak
      - auth-service
    networks:
      - oauth2-network

networks:
  oauth2-network:
    driver: bridge
